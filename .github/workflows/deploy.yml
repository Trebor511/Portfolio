name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Verify production files
        shell: bash
        run: |
          echo "===== DIST ROOT ====="
          find dist -maxdepth 2 -type f -print

          echo "===== MEDIA FILES ====="
          find dist/media -maxdepth 3 -type f -printf '%p %s bytes\n'

          echo "===== REQUIRED FILE CHECKS ====="
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/social-preview.png

          test -f dist/media/moms-kitchen/poster.webp
          test -f dist/media/moms-kitchen/demo.mp4

          test -f dist/media/pixelcution/poster.webp
          test -f dist/media/pixelcution/demo.mp4

          test -f dist/media/level-renderer/poster.webp
          test -f dist/media/level-renderer/demo.mp4

          echo "===== DIST SIZE ====="
          du -sh dist

          echo "All required production files are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4